<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Cadastrar</title>
  </head>

  <body class="bg-gray-200">
    <div class="ml-4 mt-4"><p class="text-red-500">Crie Sua Conta</p></div>

    <div class="flex ml-4 mt-4">
      <h1 class="pr-3">Coloque seu nome:</h1>
      <input class="bg-white" id="nomeT" />
    </div>

    <div class="flex ml-4 mt-4">
      <h1 class="pr-3">Coloque sua senha:</h1>
      <input class="bg-white" id="senhaT" />
    </div>

    <div class="flex ml-4 mt-4">
      <h1 class="pr-3">Qual sua idade:</h1>
      <input class="bg-white" id="idadeT" />
    </div>

    <div class="m-4 flex">
      <button onclick="myLogin()" class="w-60 h-10 m-2 bg-blue-300">
        Já tenho conta
      </button>

      <button
        onclick="myFunctionCadastrar()"
        class="w-60 h-10 m-2 bg-green-300"
      >
        Cadastrar
      </button>
    </div>

    <script>
      function myLogin() {
        window.location.href = "login.html";
      }

      function myFunctionCadastrar() {
        let nomeT = document.getElementById("nomeT").value;
        let senhaT = document.getElementById("senhaT").value;
        let idadeT = Number(document.getElementById("idadeT").value); // Convertido para número (opcional, dependendo do backend)

        fetch("http://127.0.0.1:8000/adicionar_user", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nome: nomeT,
            senha: senhaT,
            idade: idadeT,
          }),
        })
          .then((response) => {
            if (response.ok) {
              console.log("Usuário cadastrado com sucesso!");
            } else {
              console.error("Erro ao cadastrar usuário.");
            }
          })
          .catch((error) => {
            console.error("Erro de rede:", error);
          });
      }
    </script>
  </body>
</html>
