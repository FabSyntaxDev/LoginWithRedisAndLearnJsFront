<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
  </head>
  <body class="bg-gray-200">
    <div class="flex ml-4 mt-4">
      <h1 class="pr-3">Coloque seu nome:</h1>
      <input class="bg-white" id="emailT" />
    </div>

    <div class="flex ml-4 mt-4">
      <h1 class="pr-3">Coloque sua senha:</h1>
      <input class="bg-white" id="senhaT" />
    </div>

    <div class="m-4">
      <button onclick="myFunction()" class="w-60 h-10 bg-blue-300">
        Entrar
      </button>
    </div>

    <script>
      function myFunction() {
        let txtE = document.getElementById("emailT").value;
        let txtS = document.getElementById("senhaT").value;

        fetch("http://127.0.0.1:8000/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nome: txtE,
            senha: txtS,
          }),
        })
          .then((resposta) => resposta.json())
          .then((dados) => {
            if (dados.nome == "Usuario não existe") {
              console.log("Usuario não existe");
              alert("Usuario não existe");
            }
            if (dados.nome == "Bem-Vindo") {
              console.log("Seja bem vindo ao sistema " + txtE);
              alert("Seja bem vindo ao sistema " + txtE);
            }
          });
      }
    </script>
  </body>
</html>
